name: Keep backend warm

# Render's free tier spins the service down after ~15 minutes with no
# requests. GitHub's cron scheduler is often delayed by up to 10–15 min under
# load, so a 10-minute interval can easily produce a 20+ minute gap — past
# Render's idle threshold. Running at *:00, *:05, *:14, *:19, ... (every 5
# minutes) gives two independent pings inside any 15-minute window, so even
# if GitHub delays one by 10 minutes the other still lands in time.
#
# Each step also retries up to 3 times with a 10s backoff so a transient
# network hiccup doesn't count as a missed ping.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}   # manual trigger from the Actions tab for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint (with retry)
        run: |
          URL="https://splitapp-backend-p2hz.onrender.com/api/health"
          echo "Pinging $URL"
          for attempt in 1 2 3; do
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$URL")
            echo "Attempt $attempt — status: $status"
            if [ "$status" = "200" ]; then
              echo "Backend is warm."
              exit 0
            fi
            echo "Non-200 response, retrying in 10s..."
            sleep 10
          done
          echo "::warning::Backend health check did not return 200 after 3 attempts (last status: $status)"
          exit 0   # don't fail the workflow — a warning is enough
